<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B7A75">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi semana">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Semana Productiva</title>
<style>
:root { color-scheme: light; --bg: #F2F5F6; --surface: #FFFFFF; --fg: #13222B; --muted: #5B6B75; --line: #D9E1E5; --accent: #0B7A75; --err: #B42318; }
@media (prefers-color-scheme: dark) { :root { color-scheme: dark; --bg: #0E161B; --surface: #152229; --fg: #E6EEF2; --muted: #93A5AF; --line: #243640; --accent: #3CC4BC; --err: #FDA29B; } }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; line-height: 1.45; display: flex; align-items: center; justify-content: center; padding: 16px; }
.box { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px 20px; }
h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: -.01em; }
p { margin: 0 0 16px; color: var(--muted); }
input[type=password], input[type=text] { width: 100%; font: inherit; font-size: 16px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
label.rem { display: flex; gap: 8px; align-items: center; margin: 12px 0 16px; color: var(--muted); font-size: 14px; }
button { width: 100%; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 10px; padding: 12px; cursor: pointer; }
@media (prefers-color-scheme: dark) { button { color: #0E161B; } }
button:disabled { opacity: .6; }
#msg { margin: 12px 0 0; min-height: 20px; color: var(--err); font-size: 14px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main class="box">
  <h1>Semana Productiva</h1>
  <p id="sub">Contenido privado. Escribe tu contraseña para abrirlo.</p>
  <form id="f" hidden>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Contraseña" aria-label="Contraseña" required>
    <label class="rem"><input type="checkbox" id="rem" checked> Recordar en este dispositivo</label>
    <button id="go" type="submit">Abrir</button>
  </form>
  <p id="msg" role="alert"></p>
</main>

    return new TextDecoder().decode(buf);
  }
  async function tryStored() {
    try {
      var k = localStorage.getItem('sp-k');
      if (!k) return false;
      var key = await crypto.subtle.importKey('raw', u8(k), 'AES-GCM', false, ['decrypt']);
      show(await dec(key));
      return true;
    } catch (e) {
      try { localStorage.removeItem('sp-k'); } catch (x) {}
      return false;
    }
  }
  async function submit(ev) {
    ev.preventDefault();
    $('msg').textContent = '';
    $('go').disabled = true; $('go').textContent = 'Abriendo…';
    try {
      var km = await crypto.subtle.importKey('raw', new TextEncoder().encode($('pw').value), 'PBKDF2', false, ['deriveKey']);
      var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(P.s), iterations: P.n, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
      var html = await dec(key);
      if ($('rem').checked) {
        try { var raw = await crypto.subtle.exportKey('raw', key); localStorage.setItem('sp-k', b64(new Uint8Array(raw))); } catch (e) {}
      }
      show(html);
    } catch (e) {
      $('msg').textContent = 'Contraseña incorrecta.';
      $('go').disabled = false; $('go').textContent = 'Abrir';
      $('pw').select();
    }
  }
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
  if (!(window.crypto && crypto.subtle)) {
    $('sub').textContent = 'Este navegador no puede abrir el contenido desde un archivo. Ábrelo desde el enlace de internet (https).';
    return;
  }
  $('f').addEventListener('submit', submit);
  tryStored().then(function (ok) { if (!ok) { $('f').hidden = false; $('pw').focus(); } });
})();
</script>
